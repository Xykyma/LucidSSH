# Конфигурация упаковки и публикации. BLK-01 закрыт решением от 08.07.2026:
# релиз 1.0 выходит БЕЗ Code Signing Certificate (Artifact Signing недоступен
# для РФ, сторонние CA нестабильны) — см. Release_and_Update_Strategy.md §9.
# Целостность обновления проверяется через SHA-256/sha512 (electron-updater
# делает это по умолчанию через latest.yml, без цифровой подписи, UPD-03).
# Возврат к подписи (MSIX или публичный CA) рассматривается в 1.1+ — тогда
# здесь понадобятся win.signtoolOptions/certificateFile (ключ ВНЕ репозитория,
# SIGN-02) и publisherName ожидаемого издателя.
appId: app.lucidssh
productName: LucidSSH
directories:
  output: release
# 1024x1024 PNG — источник иконки для macOS/Linux (electron-builder сам
# генерирует .icns/.png-сеты). Для Windows используется win.icon ниже —
# отдельно собранный .ico с рендером под каждый размер (16–256px) из SVG,
# чтобы мелкие размеры в панели задач/меню «Пуск» не размывались при
# простом ресайзе одного большого PNG.
icon: resources/icon.png
files:
  - out/**
  - assets/**
  - package.json
  - "!**/node_modules/better-sqlite3/deps/**"
  - "!**/node_modules/better-sqlite3/src/**"
# UI поставляется только на ru/en (§5a) — обрезаем встроенные Chromium-переводы
# нативных пунктов меню/спеллчекера до нужных языков, остальные 53 .pak не нужны.
electronLanguages:
  - ru
  - en-US
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
linux:
  target:
    - AppImage
    - deb
    - rpm
    - snap
    - pacman
    - freebsd
    - apk
    - tar.gz
    - zip
  category: Network
  maintainer: xyisgory@email.com
  syncDesktopName: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Не пересоздавать удалённый пользователем ярлык рабочего стола при
  # переустановке/обновлении — см. build/installer.nsh.
  include: build/installer.nsh
# Источник обновлений (OQ-08): публичный GitHub Releases, без токена (SIGN-02).
# owner/repo — плейсхолдеры, подставляются перед первым релизом. Из этого блока
# electron-builder генерирует app-update.yml, который читает electron-updater.
publish:
  provider: github
  owner: Xykyma
  repo: LucidSSH
  releaseType: release
