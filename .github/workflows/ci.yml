name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Tests run against the Node ABI (CLAUDE.md §9); packaging needs the
      # Electron ABI, hence the rebuild step after `npm test`.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - if: github.event_name == 'pull_request'
        run: npm run rebuild:app
      - if: github.event_name == 'pull_request'
        run: npm run dist -- --win --publish never
      - name: Verify Windows packages (NSIS Setup + Portable)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path release/LucidSSH-Setup-*.exe)) { throw "NSIS Setup exe not found" }
          if (-not (Test-Path release/LucidSSH-Portable-*.exe)) { throw "Portable exe not found" }

  build-linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm test
      # Native modules must match the Electron ABI for packaging (CLAUDE.md §9).
      - run: npm run rebuild:app
      - run: npm run dist -- --linux --publish never
      - name: Verify Linux packages (AppImage + DEB)
        run: ls release/*.AppImage release/*.deb
