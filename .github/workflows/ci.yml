name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # No rebuild step: a clean `npm ci` builds better-sqlite3/keytar against
      # the Node ABI, which is what vitest needs (see CLAUDE.md §9).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm test
      # Native modules must match the Electron ABI for packaging (CLAUDE.md §9).
      - run: npm run rebuild:app
      - run: npm run dist -- --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lucidssh-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
