name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Tests run against the Node ABI (CLAUDE.md §9); packaging below needs
      # the Electron ABI, hence the rebuild step after `npm test`.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run rebuild:app
      - run: npm run dist -- --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lucidssh-windows
          path: |
            release/LucidSSH-Setup-*.exe
            release/LucidSSH-Portable-*.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get install -y libsecret-1-dev
      - run: npm ci
      - run: npm test
      # Native modules must match the Electron ABI for packaging (CLAUDE.md §9).
      - run: npm run rebuild:app
      - run: npm run dist -- --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lucidssh-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          retention-days: ${{ github.event_name == 'push' && 30 || 7 }}
