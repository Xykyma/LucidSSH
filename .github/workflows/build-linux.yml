name: Build Linux App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Установка системных зависимостей (libsecret для keytar)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libarchive-tools

      - name: Установка npm-пакетов
        run: npm ci

      - name: Пересборка нативных модулей под Electron (Linux)
        run: npx electron-rebuild -f -w better-sqlite3,keytar

      - name: Сборка приложения (electron-vite + electron-builder)
        run: npm run dist -- --linux AppImage deb rpm -c.publish=null

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
          retention-days: 7
