name: Build Linux App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Установка системных зависимостей (libsecret для keytar)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libarchive-tools

      - name: Установка npm-пакетов
        run: npm ci

      - name: Пересборка нативных модулей под Electron (Linux)
        run: npx electron-rebuild -f -w better-sqlite3,keytar

      - name: Сборка приложения (electron-vite + electron-builder)
        run: npm run dist -- --linux --publish never
        env:
          ELECTRON_DISABLE_SANDBOX: 1

      - name: Загрузка AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-AppImage
          path: release/*.AppImage
          retention-days: 7
      
      - name: Загрузка .deb
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-deb
          path: release/*.deb
          retention-days: 7
      
      - name: Загрузка .rpm
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-rpm
          path: release/*.rpm
          retention-days: 7

      - name: Загрузка .tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-tar.gz
          path: release/*.tar.gz
          retention-days: 7
      
      - name: Загрузка .snap
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-snap
          path: release/*.snap
          retention-days: 7
      
      - name: Загрузка .apk
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-apk
          path: release/*.apk
          retention-days: 7

      - name: Загрузка .zip
        uses: actions/upload-artifact@v4
        with:
          name: LucidSSH-zip
          path: release/*.zip
          retention-days: 7