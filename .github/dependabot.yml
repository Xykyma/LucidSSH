
version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

    groups:
      routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "electron"
          - "electron-builder"
          - "electron-updater"
          - "electron-vite"
          - "ssh2"
          - "better-sqlite3"
          - "keytar"
          - "@xterm/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

    groups:
      actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
